<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knight School</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="stylesheet" href="vendor/chessground.base.css">
  <link rel="stylesheet" href="vendor/chessground.brown.css">
  <link rel="stylesheet" href="vendor/chessground.cburnett.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/coach"><span>♞</span> Knight School</a>
    <nav>
      <a href="#/coach" data-tab="coach">Coach</a>
      <a href="#/learn" data-tab="learn">Learn</a>
      <a href="#/puzzles" data-tab="puzzles">Puzzles</a>
      <a href="#/review" data-tab="review">Review</a>
    </nav>
    <div class="toggles">
      <button id="tChat" class="chatbtn" title="Talk to your coach" aria-haspopup="dialog">💬<span> Ask coach</span></button>
      <button id="tSound" title="Sound effects">🔊</button>
      <button id="tVoice" title="Coach voice settings" aria-haspopup="true">🗣️</button>
      <button id="tSync" title="Sync progress between devices" aria-haspopup="true">☁️</button>
    </div>
    <div id="syncPanel" class="vpanel" hidden></div>
    <div id="voicePanel" class="vpanel" hidden>
      <h3>Coach voice</h3>
      <label class="vrow"><input type="checkbox" class="v-on"> Talk out loud</label>
      <label>Voice<select class="v-name"></select></label>
      <label>Speed<input type="range" class="v-rate" min="0.7" max="1.5" step="0.05"></label>
      <button class="v-test primary">▶ Test voice</button>
      <small class="vstatus"></small>
      <p class="vhint">AI voices are free and run on your device. Each one downloads about 60 MB the first time you use it, then works offline.</p>
    </div>
  </header>
  <main id="view"></main>
  <section id="chatPanel" class="chat" role="dialog" aria-label="Chat with Coach Knox" hidden></section>
  <script type="module" src="js/main.js"></script>
</body>
</html>
